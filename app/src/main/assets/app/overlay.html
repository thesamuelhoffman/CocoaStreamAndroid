      <div class="ov-volume-group" data-role="volume-group">
        <button class="ov-icon-btn" data-action="mute" data-role="mute-btn" title="Mute (M)">
          <svg data-icon="vol-high" viewBox="0 0 512 512"><use href="#i-volume-high"/></svg>
          <svg data-icon="vol-low" viewBox="0 0 512 512" class="hidden"><use href="#i-volume-low"/></svg>
          <svg data-icon="vol-mute" viewBox="0 0 512 512" class="hidden"><use href="#i-volume-mute"/></svg>
        </button>
        <input class="ov-volume" data-role="volume" type="range" min="0" max="1" step="0.01" value="1" />
      </div>
      <div class="ov-time" data-role="time">0:00 / 0:00</div>
      <div class="ov-spacer"></div>

      <div class="ov-menu-wrap" data-role="episodes-wrap">
        <button class="ov-icon-btn hidden" data-action="episodes-toggle" data-role="episodes-btn" title="Episodes">
          <svg viewBox="0 0 512 512"><use href="#i-episodes"/></svg>
        </button>
        <div class="ov-menu ov-menu-up ov-menu-wide hidden" data-role="episodes-menu"></div>
      </div>

      <div class="ov-menu-wrap" data-role="captions-wrap">
        <button class="ov-icon-btn" data-action="captions-toggle" title="Subtitles (C)">
          <svg viewBox="0 0 512 512"><use href="#i-subtitles"/></svg>
        </button>
        <div class="ov-menu ov-menu-up hidden" data-role="captions-menu"></div>
      </div>

      <div class="ov-menu-wrap hidden" data-role="audio-wrap">
        <button class="ov-icon-btn" data-action="audio-toggle" title="Audio tracks (B)">
          <svg viewBox="0 0 512 512"><use href="#i-audio-tracks"/></svg>
        </button>
        <div class="ov-menu ov-menu-up hidden" data-role="audio-menu"></div>
      </div>

      <div class="ov-menu-wrap" data-role="speed-wrap">
        <button class="ov-pill ov-speed-btn" data-action="speed-toggle" data-role="speed-label" title="Playback speed">1×</button>
        <div class="ov-menu ov-menu-up hidden" data-role="speed-menu"></div>
      </div>

      <button class="ov-icon-btn hidden" data-action="next" data-role="next-btn" title="Next episode">
        <svg viewBox="0 0 512 512"><use href="#i-next"/></svg>
      </button>
      <button class="ov-icon-btn" data-action="full" title="Fullscreen (F)">
        <svg data-icon="expand" viewBox="0 0 512 512"><use href="#i-maximize"/></svg>
        <svg data-icon="collapse" viewBox="0 0 512 512" class="hidden"><use href="#i-minimize"/></svg>
      </button>
      <div class="ov-menu-wrap" data-role="options-wrap">
        <button class="ov-icon-btn hidden" data-action="options-toggle" data-role="options-btn" title="More options">
          <svg viewBox="0 0 512 512"><use href="#i-more-horizontal"/></svg>
        </button>
        <div class="ov-menu ov-menu-up hidden" data-role="options-menu"></div>
      </div>
    </div>
  </div>

  <script src="overlay.js" type="module"></script>
</body>
</html>
