name: Android APK

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install JavaScript test parser
        run: npm install --ignore-scripts --no-audit --no-fund
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Configure stable release signing when repository secrets are set
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            mkdir -p .signing
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > .signing/cocoastream.p12
            printf 'storeFile=.signing/cocoastream.p12\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > keystore.properties
          fi
      - name: Build installable APK
        run: ./gradlew --no-daemon assembleRelease
      - name: Name the install file
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/CocoaStream.apk
      - name: Run checks
        run: |
          bash scripts/test.sh
          python3 tests/apk-integrity.py app/build/outputs/apk/release/CocoaStream.apk
      - name: Attach APK to the published GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" app/build/outputs/apk/release/CocoaStream.apk --clobber
      - name: Save APK for manual workflow runs
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: CocoaStream-Android-APK
          path: app/build/outputs/apk/release/CocoaStream.apk
          if-no-files-found: error
